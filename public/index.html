<!doctype html>
<html lang="bn">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0a0f1e" />
    <title>HisabBoi — Offline</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        min-height: 100dvh;
        background: #0a0f1e;
        color: #e2e8f0;
        font-family: "Segoe UI", system-ui, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 24px;
        text-align: center;
      }

      .logo {
        width: 64px;
        height: 64px;
        background: rgba(16, 185, 129, 0.15);
        border: 1px solid rgba(16, 185, 129, 0.3);
        border-radius: 18px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 24px;
      }

      .logo svg {
        width: 30px;
        height: 30px;
      }

      h1 {
        font-size: 24px;
        font-weight: 700;
        color: #fff;
        margin-bottom: 8px;
        letter-spacing: -0.3px;
      }

      p {
        font-size: 14px;
        color: #64748b;
        line-height: 1.6;
        max-width: 280px;
        margin: 0 auto 32px;
      }

      button {
        background: #10b981;
        color: #022c22;
        border: none;
        border-radius: 14px;
        padding: 14px 32px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        transition: opacity 0.2s;
      }

      button:active {
        opacity: 0.8;
        transform: scale(0.97);
      }

      .dot {
        width: 8px;
        height: 8px;
        background: #ef4444;
        border-radius: 50%;
        display: inline-block;
        margin-right: 6px;
        animation: pulse 1.5s infinite;
      }

      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.3;
        }
      }

      .status {
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 12px;
        color: #475569;
        margin-top: 20px;
      }
    </style>
  </head>
  <body>
    <div class="logo">
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="#10b981"
        stroke-width="2.5"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <polyline points="22 7 13.5 15.5 8.5 10.5 2 17" />
        <polyline points="16 7 22 7 22 13" />
      </svg>
    </div>

    <h1>HisabBoi</h1>
    <p>ইন্টারনেট সংযোগ নেই। নেটওয়ার্ক চেক করে আবার চেষ্টা করুন।</p>

    <button onclick="location.reload()">আবার চেষ্টা করুন</button>

    <div class="status">
      <span class="dot"></span>
      Offline
    </div>
  </body>
</html>
